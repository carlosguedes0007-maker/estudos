<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aula 03 - Imagens e Acessibilidade | Carlos Guedes</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #fff; padding: 2rem; }
        figure { background: #151e2f; border: 1px solid #1e293b; padding: 1rem; border-radius: 12px; max-width: 600px; }
        img { width: 100%; height: auto; border-radius: 8px; }
        figcaption { color: #00ff88; margin-top: 0.5rem; text-align: center; font-style: italic; }
    </style>
</head>
<body>
    <h1>Aula 03: Inserção de Imagens, Atributo ALT e Tag Figure</h1>
    <p>A tag <strong>&lt;figure&gt;</strong> encapsula uma mídia e sua legenda <strong>&lt;figcaption&gt;</strong>, criando uma estrutura semântica perfeita para artigos técnicos:</p>
    <figure>
        <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600" alt="Tela de computador exibindo código de programação verde" loading="lazy">
        <figcaption>Figura 3.1: Ambiente de desenvolvimento otimizado de Carlos Guedes.</figcaption>
    </figure>
</body>
</html>
